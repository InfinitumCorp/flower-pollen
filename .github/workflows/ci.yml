name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Third-party notices are up to date
        run: npm run notices && git diff --exit-code THIRD_PARTY_NOTICES.md
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flower-pollen:ci .
      - name: Container starts and is healthy
        run: |
          docker run -d --name fp -p 8080:8080 flower-pollen:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/health && exit 0; sleep 1; done
          docker logs fp; exit 1
